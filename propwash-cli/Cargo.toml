[package]
name = "propwash-cli"
version = "0.13.1"
edition.workspace = true
description = "Flight log vibration analyzer CLI"
repository = "https://github.com/Iteratrix/propwash"
license = "MIT"

[dependencies]
propwash-core = { path = "../propwash-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

# The package is propwash-cli (beside propwash-core and propwash-web); the
# installed command is plain `propwash`.
[[bin]]
name = "propwash"
path = "src/main.rs"
